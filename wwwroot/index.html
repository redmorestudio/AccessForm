<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AccessForm - Document Accessibility</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="AccessFormServer.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
            <div style="font-size: 48px; margin-bottom: 20px;">⚡</div>
            <h3>Loading AccessForm...</h3>
            <p style="color: #666;">Preparing document accessibility tools</p>
            <div style="margin-top: 20px;">
                <div style="width: 200px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 0 auto; overflow: hidden;">
                    <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); animation: loading 2s infinite;"></div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
    </style>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #ff6b6b; color: white; padding: 1rem; z-index: 1000;">
        An unhandled error has occurred.
        <a href="" class="reload" style="color: white; text-decoration: underline;">Reload</a>
        <a class="dismiss" style="color: white; cursor: pointer; float: right;">🗙</a>
    </div>
    
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/accessform.js"></script>
</body>
</html>
